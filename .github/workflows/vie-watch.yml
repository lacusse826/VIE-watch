name: VIE Watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Lancer la surveillance
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python vie_watch.py

      - name: Sauvegarder l'état (offres déjà vues)
        run: |
          git config user.name "vie-watch-bot"
          git config user.email "vie-watch-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "update: état des offres suivies"
          git push
